# Spotibai on Netlify — app lives in MainApplication/ (Vite SPA).
# Dashboard: New site from Git → pick Nepthys2006/Spotibai → settings below
# are picked up automatically. Then add env vars + deploy (see README).

[build]
  base = "MainApplication"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback for react-router (must come last, lowest priority).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (spec §5: CSP + HSTS). External hosts: Supabase project only.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src https://jsucuohtjkmeljumlruk.supabase.co; connect-src 'self' https://jsucuohtjkmeljumlruk.supabase.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Long-cache hashed build assets (Vite emits fingerprinted filenames).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
